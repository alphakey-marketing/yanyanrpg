<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>燕雲武俠 RPG</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #0d0d0d;
        overflow: hidden;
        touch-action: none;
      }
      #app-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Phaser canvas is injected into #game-container */
      #game-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #game-container canvas {
        display: block;
        margin: auto;
      }
      /* React UI overlay */
      #ui-root {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }

      /* ── Forced landscape on mobile ─────────────────────────────────────── */
      /* When the device is held in portrait mode we rotate the entire shell   */
      /* 90 degrees so the game always renders landscape.  We swap width/height */
      /* so the rotated content still fills the screen correctly.              */
      @media screen and (orientation: portrait) and (max-width: 1024px) {
        #app-shell {
          position: fixed;
          top: 0;
          left: 0;
          /* After rotation the logical width becomes the physical height */
          width: 100vh;
          height: 100vw;
          transform-origin: top left;
          transform: rotate(90deg) translateY(-100%);
          overflow: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <div id="game-container"></div>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
